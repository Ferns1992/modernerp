name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a 'Run workflow' button on the Actions tab, so a pipeline can be
  # started by hand without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck plus the branch-query and receipt suites.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build